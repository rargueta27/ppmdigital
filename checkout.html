<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | PPM Digital</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<div class="container">
  <h1>Payments</h1>
  <p>Complete your payment securely using Stripe.</p>

  <button id="checkout-button">
    Pay Securely
  </button>

  <p style="margin-top:20px; font-size:14px;">
    Payments are processed securely by Stripe. We do not store your payment information.
  </p>
</div>

<footer>
  <div class="footer-content">
    © 2026 PPM Digital |
    <a href="privacy.html">Privacy</a> |
    <a href="terms.html">Terms</a> |
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script>
  const stripe = Stripe("pk_test_YOUR_PUBLIC_KEY_HERE");

  document
    .getElementById("checkout-button")
    .addEventListener("click", () => {
      fetch("/create-checkout-session", {
        method: "POST",
      })
      .then(res => res.json())
      .then(data => stripe.redirectToCheckout({ sessionId: data.id }));
    });
</script>

</body>
</html>
