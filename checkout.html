<!DOCTYPE html>
<html lang="en">
<head>

</head>

  </p>
</div>

<footer>
  <div class="footer-content">
    © 2026 PPM Digital |
    <a href="privacy.html">Privacy</a> |
    <a href="terms.html">Terms</a> |
    <a href="contact.html">Contact</a>
  </div>
</footer>
<script>
  // No need for 'const stripe = Stripe(...)' for this method!
  
  document.getElementById("checkout-button").addEventListener("click", () => {
    // Replace the URL below with the one you copied from Stripe
    window.location.href = " https://buy.stripe.com/5kQ8wPacL6Cr28Z5JP0x200 ";
  });
</script>

</body>
</html>
